services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: attendai
      POSTGRES_USER: attendai
      POSTGRES_PASSWORD: attendai
    volumes: [attendance_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U attendai"], interval: 5s, timeout: 3s, retries: 10}
  api:
    build: {context: ., dockerfile: Dockerfile.backend}
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
  web:
    build: {context: ., dockerfile: Dockerfile.streamlit}
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
volumes: {attendance_data: {}}
