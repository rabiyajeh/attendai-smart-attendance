name: Streamlit deployment smoke test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Import application dependencies
        run: python -c "import cv2,numpy,pandas,streamlit,cryptography; print(cv2.__version__,numpy.__version__)"
      - name: Compile application
        run: python -m py_compile streamlit_app.py attendai/database.py attendai/vision.py
      - name: Start and check Streamlit
        shell: bash
        run: |
          streamlit run streamlit_app.py --server.headless=true --server.port=8501 >streamlit.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8501/_stcore/health && exit 0
            sleep 1
          done
          cat streamlit.log
          exit 1
